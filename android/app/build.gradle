apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ============================================================================
//  THE ICON FONTS, WHICH ANDROID DOES NOT GET FOR FREE
// ============================================================================
//  On iOS the nineteen icon fonts are listed in Info.plist under UIAppFonts.
//  Android has no equivalent list; the fonts have to be COPIED into the
//  assets folder at build time, and that is what this gradle file does.
//
//  Leave it out and nothing fails. The app builds, launches, runs, and every
//  single icon in it renders as an empty square. Nothing in the log explains
//  why, and the screens look like a styling bug rather than a missing build
//  step.
//
//  src/core/androidBoot.test.ts checks this line is here, because a silent
//  failure is worth a test and this one is invisible from the JavaScript.
// ============================================================================
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.salihkilic.successor"
    defaultConfig {
        applicationId "com.salihkilic.successor"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ====================================================================
        //  THE NUMBER PLAY KEYS ON, AND THE NUMBER PEOPLE READ
        // ====================================================================
        //  versionCode is an integer Play uses to order builds. It must go up
        //  by at least one for every upload; the same number twice is rejected
        //  at the point of upload with a message about the file, not about
        //  this line.
        //
        //  versionName is a string and Play does not care about it. It is what
        //  shows in the store listing and in the app's own About row, so it
        //  moves when there is something to tell a player about.
        //
        //  2: the first upload carried a silent purchase bug. The entitlement
        //  identifier in src/core/ads/config.ts was `ad_free` while the
        //  RevenueCat dashboard grants `premium`, which means that build takes
        //  a payment and grants nothing, with no error anywhere. Nothing a
        //  tester could see, which is exactly why the number moves rather than
        //  the build being quietly replaced.
        // ====================================================================
        //  3: the diagnostics panel. And versionName moves with it, which it
        //  should have done at 2 and did not. Leaving it at "1.0" for both
        //  builds meant the phone could not say which one it was running, and
        //  the question "is this the fixed binary" needed `adb dumpsys`
        //  instead of the About row. That was a real cost during a real bug.
        //  4: the entitlement identifier, corrected to the dashboard's exact
        //  string. `Premium`, with the capital. 3 only worked because of the
        //  fallback in billing.ts, which is a net rather than a design.
        //  5: Play reported 4 as already used. A versionCode is consumed by
        //  the UPLOAD, not by the release: a bundle that was sent and then
        //  abandoned still burns its number forever.
        //
        //  6: the About row now shows these two numbers instead of a frozen
        //  "v1.0.0". src/core/appVersion.ts carries the copy and
        //  appVersion.test.ts proves the two files agree, so BOTH move
        //  together or the suite goes red.
        //  7: the purchase sheet, the price on the button, and the offer
        //  after every tenth advertisement. Also the market catalogue's names
        //  and tickers, which changed in a way a player will notice.
        versionCode 7
        versionName "1.0.4"
    }
    // ========================================================================
    //  SIGNING
    // ========================================================================
    //  The template shipped `release` signed with the DEBUG key, with its own
    //  warning sitting on the line. Google Play rejects that, so until this
    //  block existed there was no way to upload anything at all.
    //
    //  The passwords are NOT here and never will be. They live in
    //  ~/.gradle/gradle.properties, which is outside the repository, because
    //  android/gradle.properties is committed and a secret that reaches git
    //  history is a secret that has to be replaced. The upload key cannot be
    //  replaced: Play freezes it at the first upload the same way it freezes
    //  applicationId, so losing or burning it costs the listing.
    // ========================================================================
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            // Guarded, because a machine without the properties still has to
            // be able to CONFIGURE this project - `assembleDebug`, `tasks`,
            // and every Gradle invocation reads this block whether or not it
            // is building a release.
            //
            // What the guard leaves behind is a signing config with a null
            // storeFile, and the first real run of `bundleRelease` showed
            // exactly what that costs:
            //
            //     > Task :app:signReleaseBundle FAILED
            //     > java.lang.NullPointerException (no error message)
            //
            //  Four and a half minutes of compiling, and then a stack-free
            //  null pointer naming nothing. `checkUploadSigningProperties`
            //  at the bottom of this file turns that into a sentence.
            if (project.hasProperty('SUCCESOR_UPLOAD_STORE_FILE')) {
                storeFile file(SUCCESOR_UPLOAD_STORE_FILE)
                storePassword SUCCESOR_UPLOAD_STORE_PASSWORD
                keyAlias SUCCESOR_UPLOAD_KEY_ALIAS
                keyPassword SUCCESOR_UPLOAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Was `signingConfigs.debug`. That is the single line standing
            // between this project and the Play Console.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// ============================================================================
//  SAY WHY THE RELEASE BUILD CANNOT BE SIGNED, INSTEAD OF THROWING A NULL
// ============================================================================
//  Gradle reaches the signing task LAST, after every module has compiled. So
//  a missing password does not fail in the first second, it fails at minute
//  four with `java.lang.NullPointerException (no error message)` - which
//  names neither the property, nor the file, nor the fact that a password is
//  involved at all. Measured, not assumed: that is the literal output of the
//  first `./gradlew bundleRelease` run on this project.
//
//  This is the check that was missing, not a second way to sign. The build
//  still fails; it just says something.
//
//  Deliberately scoped to the task GRAPH rather than to configuration. A
//  hard `throw` in the signingConfigs block would break `assembleDebug`,
//  `./gradlew tasks` and Android Studio's sync on any machine without the
//  properties, which is every machine but one.
// ============================================================================
gradle.taskGraph.whenReady { graph ->
    if (project.hasProperty('SUCCESOR_UPLOAD_STORE_FILE')) return

    def signingRelease = graph.allTasks.any { task ->
        task.path.startsWith(":${project.name}:") &&
            task.name ==~ /(?i)(sign|package).*release.*/
    }
    if (!signingRelease) return

    throw new GradleException("""

  The release build has no upload key.

  Gradle would fail at :app:signReleaseBundle with a bare
  NullPointerException, four minutes from now, naming none of this.

  These four properties are missing. They belong in

      ~/.gradle/gradle.properties

  which is OUTSIDE this repository on purpose, because
  android/gradle.properties is committed:

      SUCCESOR_UPLOAD_STORE_FILE=succesor-upload.keystore
      SUCCESOR_UPLOAD_KEY_ALIAS=succesor-upload
      SUCCESOR_UPLOAD_STORE_PASSWORD=<the password you chose>
      SUCCESOR_UPLOAD_KEY_PASSWORD=<the same password>

  STORE_FILE is resolved relative to android/app/, so the bare
  filename is correct as long as the keystore sits next to
  debug.keystore.

  Debug builds are unaffected and need none of this.
""")
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
